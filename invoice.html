<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/><title>Invoice</title>
<style>
:root{--ink:#14202b;--muted:#5d6b78;--line:#e3e8ee;--accent:#1f6fd1}
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink)}
.bar{max-width:820px;margin:18px auto 0;padding:0 16px;display:flex;gap:10px;justify-content:flex-end}
.bar button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;min-height:44px}
.bar button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.sheet{max-width:820px;margin:14px auto 40px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(20,32,43,.08);padding:40px 44px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:22px}
.biz h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}.biz p{margin:2px 0;color:var(--muted);font-size:14px;white-space:pre-line}
.meta{text-align:right}.meta h2{margin:0;font-size:30px;letter-spacing:.12em;color:var(--accent)}
.meta table{margin-left:auto;margin-top:8px;font-size:14px}.meta td{padding:2px 0 2px 14px}.meta td:first-child{color:var(--muted)}
.billto{margin:26px 0 18px}.billto small{display:block;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}.billto strong{font-size:17px}
table.items{width:100%;border-collapse:collapse;font-size:15px}
.items th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 6px}
.items td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:top}.items .n{text-align:right;white-space:nowrap}
.totals{margin-left:auto;margin-top:16px;width:min(320px,100%);font-size:15px}.totals div{display:flex;justify-content:space-between;padding:6px 0}
.totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:20px;font-weight:800}
.pay{margin-top:30px;padding:16px 18px;background:#f5f8fb;border-radius:10px;font-size:14px;white-space:pre-line}.pay strong{display:block;margin-bottom:4px}
.note{margin-top:16px;color:var(--muted);font-size:14px;white-space:pre-line}
.foot{margin-top:34px;color:#9aa6b2;font-size:12px;text-align:center}
.stamp{position:absolute;top:120px;right:-40px;transform:rotate(28deg);background:#14a05a;color:#fff;font-weight:900;letter-spacing:.2em;padding:8px 70px;font-size:18px}
.stamp.late{background:#d6452f}
.err{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
@media(max-width:600px){.sheet{padding:26px 20px;border-radius:0;margin-top:10px}.meta{text-align:left}.meta table{margin-left:0}.meta td{padding:2px 14px 2px 0}.top{flex-direction:column}}
@media print{body{background:#fff}.bar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}}
</style></head>
<body>
<div class="bar"><button class="ghost" type="button" id="copyBtn">Copy link</button><button type="button" onclick="window.print()">Print / Save PDF</button></div>
<main id="root"></main>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const root=document.getElementById('root');
  let d=null;
  try{
    const raw=location.hash.slice(1);
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(b64+'==='.slice((b64.length+3)%4));
    d=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
  }catch(_){d=null}
  if(!d||!d.c){root.innerHTML='<p class="err">This invoice link is incomplete. Ask the sender for a new link.</p>';document.querySelector('.bar').style.display='none';return}
  const cur=n=>(Number(n)||0).toLocaleString(undefined,{style:'currency',currency:d.cur||'USD'});
  const dt=s=>{if(!s)return '';const [y,m,da]=s.split('-').map(Number);return new Date(y,m-1,da,12).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})};
  const items=(d.i&&d.i.length?d.i:[{d:'Services',q:1,r:d.t}]);
  const subtotal=items.reduce((s,x)=>s+(Number(x.q)||0)*(Number(x.r)||0),0);
  const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const late=!d.p&&d.due&&d.due<today;
  document.title=`Invoice ${d.n||''} from ${d.b||'—'}`;
  root.innerHTML=`<article class="sheet">
    ${d.p?'<div class="stamp">PAID</div>':late?'<div class="stamp late">PAST DUE</div>':''}
    <div class="top"><div class="biz"><h1>${esc(d.b||'Invoice')}</h1>${d.a?`<p>${esc(d.a)}</p>`:''}${d.e?`<p>${esc(d.e)}</p>`:''}${d.ph?`<p>${esc(d.ph)}</p>`:''}</div>
      <div class="meta"><h2>INVOICE</h2><table><tr><td>Invoice #</td><td><strong>${esc(d.n||'—')}</strong></td></tr><tr><td>Issued</td><td>${esc(dt(d.iss))}</td></tr><tr><td>Due</td><td><strong>${esc(dt(d.due))}</strong></td></tr></table></div></div>
    <div class="billto"><small>Bill to</small><strong>${esc(d.c)}</strong>${d.ce?`<div style="color:var(--muted);font-size:14px">${esc(d.ce)}</div>`:''}</div>
    <table class="items"><thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>
    ${items.map(x=>`<tr><td>${esc(x.d)}</td><td class="n">${esc(x.q)}</td><td class="n">${cur(x.r)}</td><td class="n">${cur((Number(x.q)||0)*(Number(x.r)||0))}</td></tr>`).join('')}
    </tbody></table>
    <div class="totals"><div><span>Subtotal</span><span>${cur(subtotal)}</span></div>${d.p?`<div><span>Paid</span><span>−${cur(subtotal)}</span></div>`:''}<div class="grand"><span>${d.p?'Balance':'Amount due'}</span><span>${cur(d.p?0:subtotal)}</span></div></div>
    ${d.pay?`<div class="pay"><strong>How to pay</strong>${esc(d.pay)}</div>`:''}
    ${d.no?`<p class="note">${esc(d.no)}</p>`:''}
    <p class="foot">Thank you for your business.</p>
  </article>`;
  document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copyBtn').textContent='Copied'}catch(_){prompt('Copy this link',location.href)}};
})();
window.addEventListener('hashchange',()=>location.reload());
</script>
</body></html>
